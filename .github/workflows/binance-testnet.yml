# Binance Spot Testnet — ทดสอบเชื่อมต่อ + MARKET + TP/SL (OCO)
#
# Secrets:
#   BINANCE_API_KEY / BINANCE_API_SECRET  (testnet only)
# Keys: https://testnet.binance.vision

name: Binance Testnet — Order + TP/SL

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = validate only | live-order = ส่งออเดอร์ testnet จริง"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - live-order
      cleanup:
        description: "ยกเลิก OCO และขายคืนหลังทดสอบ (live-order เท่านั้น)"
        required: true
        default: true
        type: boolean
      qty:
        description: "ปริมาณ BTC (เช่น 0.001)"
        required: true
        default: "0.001"
        type: string
  push:
    branches: [main]
    paths:
      - "core/binance_client.py"
      - "core/binance_orders.py"
      - "scripts/test_binance_tpsl.py"
      - "agents/execution.py"
      - ".github/workflows/binance-testnet.yml"

jobs:
  binance-testnet:
    name: Testnet connect + TP/SL
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Check secrets present
        id: secrets
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
        run: |
          if [ -z "$BINANCE_API_KEY" ] || [ -z "$BINANCE_API_SECRET" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing secrets BINANCE_API_KEY / BINANCE_API_SECRET"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Testnet secrets found (key length ${#BINANCE_API_KEY})"
          fi

      - name: Connection + dry-run / live-order on Testnet
        if: steps.secrets.outputs.present == 'true'
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          BINANCE_ENVIRONMENT: testnet
          SYMBOL: BTCUSDT
          BINANCE_TEST_QTY: ${{ github.event.inputs.qty || '0.001' }}
        run: |
          MODE="${{ github.event.inputs.mode || 'dry-run' }}"
          CLEANUP="${{ github.event.inputs.cleanup || true }}"
          QTY="${{ github.event.inputs.qty || '0.001' }}"

          echo "MODE=$MODE CLEANUP=$CLEANUP QTY=$QTY"
          echo "Forcing BINANCE_ENVIRONMENT=testnet (never live in CI)"

          if [ "$MODE" = "live-order" ]; then
            EXTRA="--live-order"
            if [ "$CLEANUP" = "true" ]; then
              EXTRA="$EXTRA --cleanup"
            fi
            python scripts/test_binance_tpsl.py $EXTRA --qty "$QTY"
          else
            python scripts/test_binance_tpsl.py --dry-run --qty "$QTY"
          fi

      - name: Unit tests (Binance helpers)
        run: |
          pytest tests/test_binance_execution.py tests/test_binance_tpsl_helpers.py -v

      - name: Fail if secrets missing on manual run
        if: steps.secrets.outputs.present != 'true'
        run: |
          echo "Missing BINANCE_API_KEY / BINANCE_API_SECRET in repo secrets"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            exit 1
          fi

name: CI - XAUUSD Multi-Agent Trading

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:   # อนุญาตให้กด Run workflow ด้วยมือได้

jobs:
  quality:
    name: Lint • Type Check • Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff (Lint)
        run: ruff check . --output-format=github
        continue-on-error: true   # ตอนเริ่มต้นอนุญาตให้มี warning ได้

      - name: Ruff Format Check
        run: ruff format --check .
        continue-on-error: true

      - name: MyPy (Type Check)
        run: mypy agents core config utils --ignore-missing-imports
        continue-on-error: true

      - name: Pytest + Coverage
        run: |
          pytest tests/ -v --cov=agents --cov=core --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
